  services:
    app:
      image: infinite-canvas:local
      build:
        context: .
        dockerfile: Dockerfile
      env_file:
        - .env
      volumes:
        - ./data:/app/data
      environment:
        HTTP_PROXY: "http://127.0.0.1:7890"
        HTTPS_PROXY: "http://127.0.0.1:7890"
        ALL_PROXY: "socks5://127.0.0.1:7891"
        NO_PROXY: "localhost,127.0.0.1"
      network_mode: host
      restart: unless-stopped